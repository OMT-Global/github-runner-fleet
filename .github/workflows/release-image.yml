name: Release Image

on:
  workflow_dispatch:
    inputs:
      publish_project_release:
        description: Create the matching Git tag and GitHub Release after image verification
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  SHELL: /bin/bash

jobs:
  publish_and_verify:
    name: publish-and-verify
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SYNOLOGY_RUNNER_BASE_DIR: /volume1/docker/github-runner-fleet
      COMPOSE_PROJECT_NAME: github-runner-fleet
      RELEASE_LOG_DIR: /tmp/runner-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate-config -- --config config/pools.yaml --env /tmp/release.env

      - name: Enforce runner release freshness
        run: pnpm check-runner-version -- --fail-after-days 21

      - run: SMOKE_PLATFORM=linux/amd64 pnpm smoke-test

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure envsubst is available
        run: |
          set -euo pipefail
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi

          if [[ "$(id -u)" == "0" ]] && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends gettext-base
          elif command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gettext-base
          else
            echo "envsubst is required by cosign-installer." >&2
            exit 1
          fi

      - uses: sigstore/cosign-installer@v4.1.2

      - id: release_meta
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import YAML from "yaml";

          const config = YAML.parse(fs.readFileSync("config/pools.yaml", "utf8"));
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (!config?.image?.repository || !config?.image?.tag) {
            throw new Error("config/pools.yaml must define image.repository and image.tag");
          }
          if (!packageJson?.version) {
            throw new Error("package.json must define version");
          }
          if (packageJson.version !== config.image.tag) {
            throw new Error(
              `package.json version ${packageJson.version} must match config image tag ${config.image.tag}`
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `image_ref=${config.image.repository}:${config.image.tag}\n`
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `image_repo=${config.image.repository}\n`
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `image_tag=${config.image.tag}\n`
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `release_tag=v${packageJson.version}\n`
          );
          EOF

      - name: guard main branch before any publish
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "release-image may only publish from main" >&2
            exit 1
          fi

      - name: Preflight immutable release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/preflight.sh "${{ steps.release_meta.outputs.image_ref }}" "${{ steps.release_meta.outputs.release_tag }}"

      - name: Build and push unique staging reference
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        run: ./scripts/build-image.sh "${{ steps.release_state.outputs.working_ref }}" --push

      - id: image_digest
        run: |
          if [[ "${{ steps.release_state.outputs.publish_required }}" == "true" ]]; then
            digest="$(docker buildx imagetools inspect "${{ steps.release_state.outputs.working_ref }}" --format '{{.Manifest.Digest}}')"
          else
            digest="${{ steps.release_state.outputs.final_digest }}"
          fi
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${{ steps.release_state.outputs.working_ref }}" | tee /tmp/imagetools.txt
          grep -q "linux/amd64" /tmp/imagetools.txt
          grep -q "linux/arm64" /tmp/imagetools.txt

      - name: Generate image SBOM
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}
          format: spdx-json
          output-file: /tmp/github-runner-fleet.spdx.json

      - name: Sign image digest
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        run: bash scripts/release/retry.sh cosign-sign-index cosign sign --yes "${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}"

      - name: Sign per-platform image digests
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        run: |
          set -euo pipefail
          image_repo="${{ steps.release_meta.outputs.image_repo }}"
          subject="${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}"
          docker buildx imagetools inspect "${subject}" --raw \
            | jq -r '.manifests[].digest' \
            | while IFS= read -r digest; do
                bash scripts/release/retry.sh "cosign-sign-${digest#sha256:}" cosign sign --yes "${image_repo}@${digest}"
              done

      - name: Attach SBOM attestation
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        run: |
          bash scripts/release/retry.sh cosign-sbom-attest cosign attest --yes \
            --predicate /tmp/github-runner-fleet.spdx.json \
            --type spdxjson \
            "${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}"

      - name: Emit SLSA provenance
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.release_meta.outputs.image_repo }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true

      - name: Verify image signature and attestations
        run: |
          set -euo pipefail
          subject="${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}"
          timeout 5m cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${subject}" 2>&1 | tee "${RELEASE_LOG_DIR}/cosign-signature-verify.log"
          timeout 5m cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${subject}" 2>&1 | tee "${RELEASE_LOG_DIR}/cosign-sbom-verify.log"
          timeout 5m cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${subject}" 2>&1 | tee "${RELEASE_LOG_DIR}/cosign-provenance-verify.log"

      - name: Validate immutable image runtimes before promotion
        run: |
          set -euo pipefail
          bash scripts/release/validate-runtime.sh \
            "${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}" \
            2>&1 | tee "${RELEASE_LOG_DIR}/runtime-validation.log"

      - name: Promote verified digest to final tag
        if: ${{ steps.release_state.outputs.publish_required == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REQUIRE_ABSENT: "true"
        run: |
          set -euo pipefail
          bash scripts/release/preflight.sh "${{ steps.release_meta.outputs.image_ref }}" "${{ steps.release_meta.outputs.release_tag }}"
          subject="${{ steps.release_state.outputs.working_ref }}@${{ steps.image_digest.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ steps.release_meta.outputs.image_ref }}" \
            "${subject}"
          promoted_digest="$(docker buildx imagetools inspect "${{ steps.release_meta.outputs.image_ref }}" --format '{{.Manifest.Digest}}')"
          test "${promoted_digest}" = "${{ steps.image_digest.outputs.digest }}"

      - run: |
          for attempt in 1 2 3 4 5 6; do
            if pnpm validate-image -- --config config/pools.yaml --env /tmp/release.env; then
              exit 0
            fi

            if [[ "${attempt}" == "6" ]]; then
              exit 1
            fi

            sleep 10
          done

      - if: ${{ inputs.publish_project_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.release_state.outputs.release_exists }}" == "true" ]]; then
            echo "release ${{ steps.release_meta.outputs.release_tag }} already exists; verification completed without mutation"
            exit 0
          fi
          if [[ "${{ steps.release_state.outputs.publish_required }}" != "true" && "${{ steps.release_state.outputs.source_verified }}" != "true" ]]; then
            echo "refusing to create a GitHub Release for an existing image at this dispatch SHA" >&2
            exit 1
          fi

          if [[ "${{ steps.release_state.outputs.tag_exists }}" == "true" ]]; then
            tag_identity="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${{ steps.release_meta.outputs.release_tag }}" --jq '.object | "\(.type) \(.sha)"')"
            test "${tag_identity}" = "commit ${GITHUB_SHA}"
          else
            # Create atomically; never silently reuse an unrelated source tag.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
              -f "ref=refs/tags/${{ steps.release_meta.outputs.release_tag }}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
          fi

          gh release create "${{ steps.release_meta.outputs.release_tag }}" \
            --verify-tag \
            --title "${{ steps.release_meta.outputs.release_tag }}" \
            --generate-notes

      - name: Preserve verification diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_LOG_DIR }}/*.log
            /tmp/imagetools.txt
          if-no-files-found: warn
