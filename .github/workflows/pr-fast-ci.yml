name: PR Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '24.14.1'
  PYTHON_VERSION: '3.12'
  SHELL: /bin/bash

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on:
      - self-hosted
      - linux
      - shell-only
      - public
    outputs:
      behavior: ${{ steps.filter.outputs.behavior }}
      docs: ${{ steps.filter.outputs.docs }}
      unknown: ${{ steps.filter.outputs.unknown }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            behavior:
              - 'src/**'
              - 'test/**'
              - 'config/**'
              - 'docker/**'
              - 'actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'stryker.config.json'
              - 'project.bootstrap.yaml'
              - '.devcontainer/**'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - '.env.example'
              - 'CODEOWNERS'
              - 'infra/**'
              - 'ops/**'
            docs:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'README.md'
              - 'docs/**'
              - 'LICENSE*'
            unknown:
              - '**'
              - '!src/**'
              - '!test/**'
              - '!config/**'
              - '!docker/**'
              - '!actions/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!tsconfig*.json'
              - '!vitest*.ts'
              - '!stryker.config.json'
              - '!project.bootstrap.yaml'
              - '!.devcontainer/**'
              - '!.githooks/**'
              - '!.github/workflows/**'
              - '!scripts/**'
              - '!.env.example'
              - '!CODEOWNERS'
              - '!infra/**'
              - '!ops/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!README.md'
              - '!docs/**'
              - '!LICENSE*'

  fast-checks:
    name: Fast Checks
    runs-on:
      - self-hosted
      - linux
      - shell-only
      - public
    timeout-minutes: 15
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.outputs.behavior == 'true' || needs.changes.outputs.unknown == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./actions/setup-shell-safe-node
        with:
          node-version: 24.14.1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Run fast checks
        run: bash scripts/ci/run-fast-checks.sh

  validate-secrets:
    name: Validate Secrets
    runs-on:
      - self-hosted
      - linux
      - shell-only
      - public
    timeout-minutes: 10
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Scan repository for secret patterns
        run: bash scripts/check-detect-secrets.sh --all-files

  hosted-fork-fast-checks:
    name: Hosted Fork Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      (needs.changes.outputs.behavior == 'true' || needs.changes.outputs.unknown == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  hosted-fork-validate-secrets:
    name: Hosted Fork Validate Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Scan repository for secret patterns
        run: bash scripts/check-detect-secrets.sh --all-files

  ci-gate:
    name: CI Gate
    runs-on:
      - self-hosted
      - linux
      - shell-only
      - public
    if: always()
    needs:
      - changes
      - fast-checks
      - validate-secrets
      - hosted-fork-fast-checks
      - hosted-fork-validate-secrets
    steps:
      - name: Check required PR jobs
        env:
          BEHAVIOR_CHANGED: ${{ needs.changes.outputs.behavior }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          DRAFT_PULL_REQUEST: ${{ github.event.pull_request.draft }}
          UNKNOWN_CHANGED: ${{ needs.changes.outputs.unknown }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RESULTS: >-
            changes=${{ needs.changes.result }}
            fast-checks=${{ needs.fast-checks.result }}
            validate-secrets=${{ needs.validate-secrets.result }}
            hosted-fork-fast-checks=${{ needs.hosted-fork-fast-checks.result }}
            hosted-fork-validate-secrets=${{ needs.hosted-fork-validate-secrets.result }}
        run: |
          declare -A results
          for entry in $RESULTS; do
            results["${entry%%=*}"]="${entry##*=}"
          done

          expect_status() {
            local job="$1"
            local expected="$2"
            local actual="${results[$job]:-missing}"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL $job => $actual (expected $expected)"
              failed=1
            else
              echo "OK   $job => $actual"
            fi
          }

          failed=0
          expect_status changes success

          if [[ "$DRAFT_PULL_REQUEST" == "true" ]]; then
            echo "INFO draft pull request; validation jobs are intentionally skipped"
            expect_status fast-checks skipped
            expect_status validate-secrets skipped
            expect_status hosted-fork-fast-checks skipped
            expect_status hosted-fork-validate-secrets skipped
            exit "$failed"
          fi

          checks_required=false
          if [[ "$BEHAVIOR_CHANGED" == "true" || "$UNKNOWN_CHANGED" == "true" ]]; then
            checks_required=true
          elif [[ "$DOCS_CHANGED" == "true" ]]; then
            echo "INFO docs-only change; behavior checks are intentionally skipped"
          else
            echo "INFO no changed files; behavior checks are intentionally skipped"
          fi

          if [[ "$SAME_REPOSITORY" == "true" ]]; then
            expect_status validate-secrets success
            expect_status hosted-fork-validate-secrets skipped
            if [[ "$checks_required" == "true" ]]; then
              expect_status fast-checks success
            else
              expect_status fast-checks skipped
            fi
            expect_status hosted-fork-fast-checks skipped
          else
            expect_status validate-secrets skipped
            expect_status hosted-fork-validate-secrets success
            expect_status fast-checks skipped
            if [[ "$checks_required" == "true" ]]; then
              expect_status hosted-fork-fast-checks success
            else
              expect_status hosted-fork-fast-checks skipped
            fi
          fi

          exit "$failed"
