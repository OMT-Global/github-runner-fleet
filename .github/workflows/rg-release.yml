# Reusable rg-release workflow.
# Required secrets: GITHUB_TOKEN, supplied automatically by GitHub. No long-lived registry key.
# The caller must grant packages: write, id-token: write, and attestations: write when publish=true.
name: rg-release

on:
  workflow_call:
    inputs:
      image-ref:
        description: Full image reference to build, sign, and attest.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: docker/Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      platforms:
        description: Comma-separated Docker platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      publish:
        description: Push, sign, and attest the image. Set false only for caller contract smoke tests.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: rg-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ${{ inputs.image-ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish
      - name: Sign immutable image digest
        if: inputs.publish
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        if: inputs.publish
        with:
          subject-name: ${{ inputs.image-ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
