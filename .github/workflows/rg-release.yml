# Reusable rg-release workflow.
# Required secrets: GITHUB_TOKEN, supplied automatically by GitHub. No long-lived registry key.
# The caller must grant packages: write, id-token: write, and attestations: write when publish=true.
name: rg-release

on:
  workflow_call:
    inputs:
      image-ref:
        description: Full image reference to build, sign, and attest.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: docker/Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      platforms:
        description: Comma-separated Docker platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      publish:
        description: Push, sign, and attest the image. Set false only for caller contract smoke tests.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: rg-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ${{ inputs.image-ref }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: inputs.publish
      - name: Sign immutable image digest
        if: inputs.publish
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        if: inputs.publish
        with:
          subject-name: ${{ inputs.image-ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
