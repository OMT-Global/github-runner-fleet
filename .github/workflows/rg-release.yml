# Reusable rg-release workflow.
# Required secrets: registry credentials via secrets.GITHUB_TOKEN or inherited registry token.
name: rg-release

on:
  workflow_call:
    inputs:
      image-ref:
        description: Full image reference to build, sign, and attest.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: docker/Dockerfile
      context:
        description: Docker build context.
        required: false
        type: string
        default: .

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: rg-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.image-ref }}
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign --yes ${{ inputs.image-ref }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ inputs.image-ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
