version: 1
image:
  repository: ghcr.io/omt-global/github-runner-fleet
  tag: 0.2.3
pools:
  - key: synology-private
    visibility: private
    organization: omt-global
    runnerGroup: synology-private
    repositoryAccess: selected
    allowedRepositories:
      - omt-global/acme-aws
      - omt-global/anthroforge
      - omt-global/auth-gateway
      - omt-global/axiom-control-plane
      - omt-global/button-king
      - omt-global/cloudcurator
      - omt-global/commonground
      - omt-global/dockyard
      - omt-global/glacier-utilities
      - omt-global/homenet
      - omt-global/italico-design-system
      - omt-global/lattice
      - omt-global/mac-cksum
      - omt-global/mypersonalbanker
      - omt-global/omt-corner-cave
      - omt-global/omt-global-structure
      - omt-global/omtcornercave.org
      - omt-global/openclaw-control-plane
      - omt-global/openclaw-ouro
      - omt-global/pocket-parade
      - omt-global/post-no-bills
      - omt-global/tali-design-system
      - omt-global/Why-fi
    labels:
      - synology
      - shell-only
      - private
    size: 4
    scaling:
      min: 2
      max: 8
      queueThreshold: 3
      cooldownSeconds: 120
    architecture: auto
    runnerRoot: ${SYNOLOGY_RUNNER_BASE_DIR}/pools/synology-private
    # telemetry:
    #   enabled: true
    #   endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    #   protocol: http/protobuf
    #   headers: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    #   resourceAttributes:
    #     service.namespace: github-runner-fleet
    resources:
      memory: 2g
  - key: synology-public
    visibility: public
    organization: omt-global
    runnerGroup: synology-public
    repositoryAccess: selected
    allowedRepositories:
      - omt-global/.github
      - omt-global/acmeos.org
      - omt-global/apw-cli
      - omt-global/axiomlang
      - omt-global/bootstrap
      - omt-global/Flapline
      - omt-global/flow
      - omt-global/gh-attest
      - omt-global/github-runner-fleet
      - omt-global/home-tv-channel-list
      - omt-global/icloud-cli
      - omt-global/jmcte.me
      - omt-global/machete
      - omt-global/mailplus-intelligence
      - omt-global/omt-assist.org
    labels:
      - synology
      - shell-only
      - public
    size: 4
    scaling:
      min: 1
      max: 4
      queueThreshold: 3
      cooldownSeconds: 120
    architecture: auto
    runnerRoot: ${SYNOLOGY_RUNNER_BASE_DIR}/pools/synology-public
    resources:
      memory: 1g
